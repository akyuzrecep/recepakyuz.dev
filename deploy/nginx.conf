# /etc/nginx/sites-available/recepakyuz.dev
# Certificate: sudo certbot certonly --nginx -d recepakyuz.dev -d ssh.recepakyuz.dev

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name recepakyuz.dev ssh.recepakyuz.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name recepakyuz.dev ssh.recepakyuz.dev;

    ssl_certificate     /etc/letsencrypt/live/recepakyuz.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recepakyuz.dev/privkey.pem;

    # compress JSON, JS, CSS and the globe data
    gzip on;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml application/octet-stream;
    gzip_min_length 1024;
    gzip_proxied any;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
